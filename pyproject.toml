[project]
name = "medsam-grounding-dino"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Azcatchi17" }
]
requires-python = ">=3.11"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers==4.33.0",
    "mmengine==0.10.7",
    "segment-anything",
    "numpy>=1.24.0,<2.0.0",
    "opencv-python-headless>=4.8.0",
    "albumentations>=1.4.0",
    "scikit-learn>=1.3.0",
    "scikit-image>=0.21.0",
    "nibabel>=5.1.0",
    "pycocotools>=2.0.7",
    "pyyaml>=6.0.1",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "scipy>=1.11.0",
    "setuptools<70.0.0",
    "wheel",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }